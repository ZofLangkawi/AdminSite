<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Galerie d'images</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #333;
      text-align: center;
    }

    h1 {
      margin: 30px 0;
      font-size: 2rem;
      color: #222;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    .gallery img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .gallery img:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
  </style>

</head>

<body>

  <h1>Ma galerie</h1>

  <div class="gallery">
    <img src="appart1.JPG" alt="Photo 1">
    <img src="appart2.JPG" alt="Photo 2">
    <img src="appart3.JPG" alt="Photo 3">
    <img src="appart4.JPG" alt="Photo 4">
    <img src="appart5.JPG" alt="Photo 5">
  </div>

</body>
</html>
