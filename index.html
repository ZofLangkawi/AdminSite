<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Galerie appartement</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
}

h1 {
  text-align: center;
  margin: 30px 0;
}

h2 {
  max-width: 1100px;
  margin: 40px auto 10px;
  padding: 0 20px;
}

/* --- DESCRIPTION SECTION --- */
.section-text {
  max-width: 1100px;
  margin: 0 auto 15px;
  padding: 0 20px;
  color: #666;
  line-height: 1.5;
}

/* --- GRID --- */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 18px;
  padding: 0 20px 30px;
  max-width: 1100px;
  margin: auto;
}

.gallery img {
  width: 100%;
  height: 260px;
  object-fit: cover;
  border-radius: 14px;
  cursor: pointer;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.gallery img:hover {
  transform: scale(1.02);
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

/* --- LIGHTBOX --- */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 1000;
}

.lightbox.active {
  display: flex;
}

.lightbox img {
  max-width: 90%;
  max-height: 80%;
  border-radius: 12px;
  transition: opacity 0.2s ease;
}

/* NAV */
.nav {
  position: absolute;
  width: 100%;
  display: flex;
  justify-content: space-between;
  top: 50%;
  transform: translateY(-50%);
  padding: 0 20px;
}

.nav button {
  background: rgba(255,255,255,0.15);
  border: none;
  color: white;
  font-size: 30px;
  cursor: pointer;
  padding: 10px 15px;
  border-radius: 10px;
}

.nav button:hover {
  background: rgba(255,255,255,0.3);
}

/* COUNTER */
.counter {
  position: absolute;
  top: 20px;
  color: white;
  font-size: 14px;
  opacity: 0.8;
}

</style>
</head>

<body>

<h1>Appartement à louer</h1>

<!-- SALON -->
<h2>Le salon</h2>
<div class="section-text">
  Un espace lumineux avec canapé convertible, TV et coin repas.
</div>

<div class="gallery">
  <img src="appart1.JPG">
  <img src="appart2.JPG">
  <img src="appart3.JPG">
  <img src="appart4.JPG">
</div>

<!-- CHAMBRE -->
<h2>La chambre</h2>
<div class="section-text">
  Chambre calme avec lit double et rangements intégrés.
</div>

<div class="gallery">
  <img src="appart5.JPG">
  <img src="appart1.JPG">
  <img src="appart2.JPG">
  <img src="appart3.JPG">
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">

  <div class="counter" id="counter"></div>

  <div class="nav">
    <button id="prev">‹</button>
    <button id="next">›</button>
  </div>

  <img id="lightbox-img">
</div>

<script>
const images = document.querySelectorAll(".gallery img");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const counter = document.getElementById("counter");

const allImages = Array.from(images);

let currentIndex = 0;

function showImage(index) {
  if (index < 0) index = allImages.length - 1;
  if (index >= allImages.length) index = 0;

  currentIndex = index;
  lightboxImg.style.opacity = 0;

  setTimeout(() => {
    lightboxImg.src = allImages[currentIndex].src;
    counter.textContent = `${currentIndex + 1} / ${allImages.length}`;
    lightboxImg.style.opacity = 1;
  }, 120);
}

images.forEach((img, index) => {
  img.addEventListener("click", () => {
    lightbox.classList.add("active");
    currentIndex = index;
    showImage(currentIndex);
  });
});

document.getElementById("next").onclick = () => showImage(currentIndex + 1);
document.getElementById("prev").onclick = () => showImage(currentIndex - 1);

lightbox.addEventListener("click", (e) => {
  if (e.target === lightbox) {
    lightbox.classList.remove("active");
  }
});

document.addEventListener("keydown", (e) => {
  if (!lightbox.classList.contains("active")) return;

  if (e.key === "ArrowRight") showImage(currentIndex + 1);
  if (e.key === "ArrowLeft") showImage(currentIndex - 1);
  if (e.key === "Escape") lightbox.classList.remove("active");
});
</script>

</body>
</html>
